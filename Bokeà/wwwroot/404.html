<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Page not found — Bokeà</title>
    <meta name="robots" content="noindex">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
    <style>
        :root {
            --bg-body: #F8F7F5;
            --bg-card: #ffffff;
            --border-color: #e4e4e7;
            --text-main: #1A1A1A;
            --text-secondary: #57575f;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg-body: #09090b;
                --bg-card: #18181b;
                --border-color: #27272a;
                --text-main: #ffffff;
                --text-secondary: #a1a1aa;
            }
        }
        * { box-sizing: border-box; }
        html, body {
            height: 100%;
        }
        body {
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-body);
            color: var(--text-main);
        }
        .card {
            width: 100%;
            max-width: 420px;
            text-align: center;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 2.75rem 2rem;
        }
        .icon {
            width: 56px;
            height: 56px;
            border-radius: 14px;
            margin: 0 auto 1.5rem;
            display: block;
        }
        h1 {
            font-family: 'Playfair Display', Georgia, serif;
            font-size: 2.1rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin: 0 0 0.6rem;
        }
        p {
            font-size: 0.95rem;
            line-height: 1.5;
            color: var(--text-secondary);
            margin: 0 0 2rem;
        }
        .btn-home {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            background: #000000;
            color: #ffffff;
            font-weight: 600;
            font-size: 0.95rem;
            text-decoration: none;
            transition: background-color 0.15s ease;
        }
        .btn-home:hover { background: #27272a; }
        @media (prefers-color-scheme: dark) {
            .btn-home { background: #ffffff; color: #000000; }
            .btn-home:hover { background: #e4e4e7; }
        }
        .slogan {
            margin-top: 1.5rem;
            font-size: 0.78rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--text-secondary);
        }
    </style>
</head>
<body>
    <main class="card">
        <img class="icon" src="assets/icon.svg" alt="" aria-hidden="true">
        <h1>This page got parked too.</h1>
        <p>There&rsquo;s nothing at this address. It happens &mdash; no date, no nagging, just a wrong turn.</p>
        <a class="btn-home" href="/">Take me back to Bokeà</a>
        <p class="slogan">la vie est floue</p>
    </main>
</body>
</html>
