<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
  <style>
    body { margin: 0; background: #050506; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color: #ffffff; -webkit-font-smoothing: antialiased; }
    a { color: #ffffff; } a:hover { color: #e4e4e7; }
    svg { flex-shrink: 0; }
  </style>
</helmet>
<div style="min-height: 820px; padding: 40px; box-sizing: border-box; background: #050506; display: flex; justify-content: center; align-items: flex-start;">
  <div style="width: 560px; background: #18181b; border: 1px solid #27272a; border-radius: 8px; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.45); display: flex; flex-direction: column;">

    <div style="display: flex; align-items: center; justify-content: space-between; padding: 14px 14px 0 24px;">
      <div style="font-size: 13px; font-weight: 600; color: #8b8b94;">New task</div>
      <div style="width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; border-radius: 6px; color: #a1a1aa;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg>
      </div>
    </div>

    <div style="padding: 6px 24px 18px;">
      <div style="display: flex; align-items: center; font-size: 24px; font-weight: 600; letter-spacing: -0.015em; line-height: 32px; color: #ffffff;">Call Mum<span style="display: inline-block; width: 2px; height: 26px; margin-left: 2px; background: #ffffff;"></span></div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 2px; padding: 0 12px 16px;">

      <!-- Repeat (open) -->
      <div style="display: flex; flex-direction: column; background: #141416; border: 1px solid #27272a; border-radius: 8px;">
        <div style="height: 48px; display: flex; align-items: center; gap: 12px; padding: 0 12px;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#a1a1aa" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="m17 2 4 4-4 4"></path><path d="M3 11v-1a4 4 0 0 1 4-4h14"></path><path d="m7 22-4-4 4-4"></path><path d="M21 13v1a4 4 0 0 1-4 4H3"></path></svg>
          <span style="flex-grow: 1; font-size: 14px; color: #a1a1aa;">Repeat</span>
          <span style="font-size: 14px; font-weight: 600; color: #ffffff;">Every Sunday</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8b8b94" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m18 15-6-6-6 6"></path></svg>
        </div>
        <div style="display: flex; flex-direction: column; gap: 10px; padding: 2px 12px 14px 42px;">
          <div style="display: flex; flex-wrap: wrap; gap: 6px;">
            <div style="height: 32px; display: flex; align-items: center; padding: 0 12px; border-radius: 9999px; border: 1px solid #27272a; font-size: 13px; font-weight: 500; color: #a1a1aa;">Once</div>
            <div style="height: 32px; display: flex; align-items: center; padding: 0 12px; border-radius: 9999px; border: 1px solid #27272a; font-size: 13px; font-weight: 500; color: #a1a1aa;">Daily</div>
            <div style="height: 32px; display: flex; align-items: center; padding: 0 12px; border-radius: 9999px; border: 1px solid #27272a; font-size: 13px; font-weight: 500; color: #a1a1aa;">Workdays</div>
            <div style="height: 32px; display: flex; align-items: center; padding: 0 12px; border-radius: 9999px; border: 1px solid #ffffff; background: #ffffff; font-size: 13px; font-weight: 600; color: #09090b;">Weekly</div>
            <div style="height: 32px; display: flex; align-items: center; padding: 0 12px; border-radius: 9999px; border: 1px solid #27272a; font-size: 13px; font-weight: 500; color: #a1a1aa;">Monthly</div>
            <div style="height: 32px; display: flex; align-items: center; padding: 0 12px; border-radius: 9999px; border: 1px solid #27272a; font-size: 13px; font-weight: 500; color: #a1a1aa;">Every few days</div>
          </div>
          <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px;">
            <div style="height: 32px; display: flex; align-items: center; justify-content: center; border-radius: 6px; background: #18181b; border: 1px solid #27272a; font-size: 12px; font-weight: 600; color: #a1a1aa;">Mon</div>
            <div style="height: 32px; display: flex; align-items: center; justify-content: center; border-radius: 6px; background: #18181b; border: 1px solid #27272a; font-size: 12px; font-weight: 600; color: #a1a1aa;">Tue</div>
            <div style="height: 32px; display: flex; align-items: center; justify-content: center; border-radius: 6px; background: #18181b; border: 1px solid #27272a; font-size: 12px; font-weight: 600; color: #a1a1aa;">Wed</div>
            <div style="height: 32px; display: flex; align-items: center; justify-content: center; border-radius: 6px; background: #18181b; border: 1px solid #27272a; font-size: 12px; font-weight: 600; color: #a1a1aa;">Thu</div>
            <div style="height: 32px; display: flex; align-items: center; justify-content: center; border-radius: 6px; background: #18181b; border: 1px solid #27272a; font-size: 12px; font-weight: 600; color: #a1a1aa;">Fri</div>
            <div style="height: 32px; display: flex; align-items: center; justify-content: center; border-radius: 6px; background: #18181b; border: 1px solid #27272a; font-size: 12px; font-weight: 600; color: #a1a1aa;">Sat</div>
            <div style="height: 32px; display: flex; align-items: center; justify-content: center; border-radius: 6px; background: #1c1c1e; border: 1px solid #ffffff; box-shadow: 0 0 0 1px #ffffff; font-size: 12px; font-weight: 700; color: #ffffff;">Sun</div>
          </div>
        </div>
      </div>

      <!-- Closed rows -->
      <div style="height: 48px; display: flex; align-items: center; gap: 12px; padding: 0 13px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#a1a1aa" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v2"></path><path d="m4.93 4.93 1.41 1.41"></path><path d="M20 12h2"></path><path d="m19.07 4.93-1.41 1.41"></path><path d="M15.95 16.95A5 5 0 0 0 8.05 16.95"></path><path d="M2 12h2"></path><path d="M2 20h20"></path></svg>
        <span style="flex-grow: 1; font-size: 14px; color: #a1a1aa;">Time of day</span>
        <span style="font-size: 14px; font-weight: 600; color: #ffffff;">Evening</span>
        <span style="font-size: 13px; color: #8b8b94; font-variant-numeric: tabular-nums;">16:00–23:30</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#52525b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"></path></svg>
      </div>
      <div style="height: 1px; background: #27272a; margin-left: 43px;"></div>
      <div style="height: 48px; display: flex; align-items: center; gap: 12px; padding: 0 13px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#a1a1aa" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M12 6v6l4 2"></path></svg>
        <span style="flex-grow: 1; font-size: 14px; color: #a1a1aa;">Exact time</span>
        <span style="font-size: 14px; color: #8b8b94;">None</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#52525b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"></path></svg>
      </div>
      <div style="height: 1px; background: #27272a; margin-left: 43px;"></div>
      <div style="height: 48px; display: flex; align-items: center; gap: 12px; padding: 0 13px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#a1a1aa" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2h4"></path><path d="m12 14 3-3"></path><circle cx="12" cy="14" r="8"></circle></svg>
        <span style="flex-grow: 1; font-size: 14px; color: #a1a1aa;">How long</span>
        <span style="font-size: 14px; font-weight: 600; color: #ffffff;">15 min</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#52525b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"></path></svg>
      </div>
      <div style="height: 1px; background: #27272a; margin-left: 43px;"></div>
      <div style="height: 48px; display: flex; align-items: center; gap: 12px; padding: 0 13px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#a1a1aa" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"></path></svg>
        <span style="flex-grow: 1; font-size: 14px; color: #a1a1aa;">Part of life</span>
        <span style="font-size: 14px; font-weight: 600; color: #ffffff;">Health</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#52525b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"></path></svg>
      </div>
      <div style="height: 1px; background: #27272a; margin-left: 43px;"></div>
      <div style="height: 48px; display: flex; align-items: center; gap: 12px; padding: 0 13px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#a1a1aa" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"></path></svg>
        <span style="flex-grow: 1; font-size: 14px; color: #a1a1aa;">Reminder</span>
        <span style="font-size: 14px; font-weight: 600; color: #ffffff;">That morning</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#52525b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"></path></svg>
      </div>
      <div style="height: 1px; background: #27272a; margin-left: 43px;"></div>
      <div style="height: 48px; display: flex; align-items: center; gap: 12px; padding: 0 13px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#a1a1aa" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"></path><path d="M4 22v-7"></path></svg>
        <span style="flex-grow: 1; font-size: 14px; color: #a1a1aa;">Really matters</span>
        <div style="width: 48px; height: 28px; box-sizing: border-box; display: flex; align-items: center; padding: 3px; border-radius: 9999px; background: #141416; border: 1px solid #27272a;">
          <div style="width: 20px; height: 20px; border-radius: 50%; background: #8b8b94;"></div>
        </div>
      </div>
      <div style="height: 1px; background: #27272a; margin-left: 43px;"></div>
      <div style="height: 48px; display: flex; align-items: center; gap: 12px; padding: 0 13px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#a1a1aa" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M17 6H3"></path><path d="M21 12H3"></path><path d="M13 18H3"></path></svg>
        <span style="flex-grow: 1; font-size: 14px; color: #a1a1aa;">Note</span>
        <span style="font-size: 14px; color: #8b8b94;">Add</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#52525b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"></path></svg>
      </div>
    </div>

    <div style="display: flex; align-items: center; justify-content: flex-end; gap: 10px; padding: 14px 24px; border-top: 1px solid #27272a;">
      <div style="height: 40px; box-sizing: border-box; display: flex; align-items: center; padding: 0 16px; border-radius: 6px; background: #27272a; border: 1px solid #3f3f46; font-size: 14px; font-weight: 600; color: #ffffff;">Cancel</div>
      <div style="height: 40px; box-sizing: border-box; display: flex; align-items: center; padding: 0 20px; border-radius: 6px; background: #ffffff; border: 1px solid #ffffff; font-size: 14px; font-weight: 600; color: #000000;">Save task</div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
