<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
  <style>
    body { margin: 0; background: #050506; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color: #ffffff; -webkit-font-smoothing: antialiased; }
    a { color: #ffffff; } a:hover { color: #e4e4e7; }
    svg { flex-shrink: 0; }
  </style>
</helmet>
<div style="min-height: 720px; padding: 40px; box-sizing: border-box; background: #050506; display: flex; justify-content: center; align-items: flex-start;">
  <div style="width: 640px; background: #18181b; border: 1px solid #27272a; border-radius: 8px; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.45); display: flex; flex-direction: column;">

    <div style="display: flex; align-items: center; justify-content: space-between; padding: 14px 14px 0 28px;">
      <div style="font-size: 13px; font-weight: 600; color: #8b8b94;">New task</div>
      <div style="width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; border-radius: 6px; color: #a1a1aa;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px; padding: 8px 28px 28px;">
      <div style="display: flex; align-items: center; font-size: 28px; font-weight: 600; letter-spacing: -0.02em; line-height: 40px; color: #ffffff;">Call Mum<span style="display: inline-block; width: 2px; height: 30px; margin-left: 2px; background: #ffffff;"></span></div>

      <!-- The sentence. Each token opens its own picker. -->
      <div style="position: relative; min-height: 372px;">
        <div style="font-size: 22px; font-weight: 500; line-height: 48px; color: #8b8b94; text-wrap: pretty;">
          every
          <span style="display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 10px 0 12px; border-radius: 6px; background: #1c1c1e; border: 1px solid #ffffff; box-shadow: 0 0 0 1px #ffffff; color: #ffffff; vertical-align: middle;">Sunday<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m18 15-6-6-6 6"></path></svg></span>
          in the
          <span style="display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 10px 0 12px; border-radius: 6px; background: #1c1c1e; border: 1px solid #3f3f46; color: #ffffff; vertical-align: middle;">evening<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8b8b94" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"></path></svg></span>
          for
          <span style="display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 10px 0 12px; border-radius: 6px; background: #1c1c1e; border: 1px solid #3f3f46; color: #ffffff; vertical-align: middle;">15 min<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8b8b94" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"></path></svg></span>,
          part of
          <span style="display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 10px 0 12px; border-radius: 6px; background: #1c1c1e; border: 1px solid #3f3f46; color: #ffffff; vertical-align: middle;">Health<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8b8b94" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"></path></svg></span>.
        </div>

        <!-- Open picker for "Sunday" -->
        <div style="position: absolute; top: 50px; left: 52px; width: 300px; box-sizing: border-box; display: flex; flex-direction: column; padding: 6px; background: #1c1c1e; border: 1px solid #3f3f46; border-radius: 8px; box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6);">
          <div style="height: 36px; display: flex; align-items: center; padding: 0 10px; border-radius: 6px; font-size: 14px; color: #d4d4d8;">Just once</div>
          <div style="height: 36px; display: flex; align-items: center; padding: 0 10px; border-radius: 6px; font-size: 14px; color: #d4d4d8;">Every day</div>
          <div style="height: 36px; display: flex; align-items: center; justify-content: space-between; padding: 0 10px; border-radius: 6px; font-size: 14px; color: #d4d4d8;"><span>Workdays</span><span style="font-size: 12px; color: #8b8b94;">Mon–Fri</span></div>
          <div style="height: 36px; display: flex; align-items: center; justify-content: space-between; padding: 0 10px; border-radius: 6px; font-size: 14px; font-weight: 600; color: #ffffff; background: #27272a;"><span>Every week</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg></div>
          <div style="height: 36px; display: flex; align-items: center; padding: 0 10px; border-radius: 6px; font-size: 14px; color: #d4d4d8;">Every month</div>
          <div style="height: 36px; display: flex; align-items: center; padding: 0 10px; border-radius: 6px; font-size: 14px; color: #d4d4d8;">Every few days…</div>
          <div style="height: 1px; background: #3f3f46; margin: 6px -6px;"></div>
          <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; padding: 4px 4px 2px;">
            <div style="height: 32px; display: flex; align-items: center; justify-content: center; border-radius: 6px; font-size: 12px; font-weight: 600; color: #a1a1aa;">M</div>
            <div style="height: 32px; display: flex; align-items: center; justify-content: center; border-radius: 6px; font-size: 12px; font-weight: 600; color: #a1a1aa;">T</div>
            <div style="height: 32px; display: flex; align-items: center; justify-content: center; border-radius: 6px; font-size: 12px; font-weight: 600; color: #a1a1aa;">W</div>
            <div style="height: 32px; display: flex; align-items: center; justify-content: center; border-radius: 6px; font-size: 12px; font-weight: 600; color: #a1a1aa;">T</div>
            <div style="height: 32px; display: flex; align-items: center; justify-content: center; border-radius: 6px; font-size: 12px; font-weight: 600; color: #a1a1aa;">F</div>
            <div style="height: 32px; display: flex; align-items: center; justify-content: center; border-radius: 6px; font-size: 12px; font-weight: 600; color: #a1a1aa;">S</div>
            <div style="height: 32px; display: flex; align-items: center; justify-content: center; border-radius: 6px; font-size: 12px; font-weight: 700; color: #09090b; background: #ffffff;">S</div>
          </div>
        </div>
      </div>

      <!-- Extras -->
      <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding-top: 4px;">
        <div style="height: 34px; box-sizing: border-box; display: flex; align-items: center; gap: 7px; padding: 0 12px; border-radius: 9999px; background: rgba(108, 154, 119, 0.1); border: 1px solid #6c9a77; font-size: 13px; font-weight: 600; color: #8fbf9c;">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"></path></svg>
          <span>Remind me that morning</span>
        </div>
        <div style="height: 34px; box-sizing: border-box; display: flex; align-items: center; gap: 7px; padding: 0 12px; border-radius: 9999px; border: 1px solid #27272a; font-size: 13px; font-weight: 500; color: #a1a1aa;">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"></path><path d="M4 22v-7"></path></svg>
          <span>Really matters</span>
        </div>
        <div style="height: 34px; box-sizing: border-box; display: flex; align-items: center; gap: 7px; padding: 0 12px; border-radius: 9999px; border: 1px dashed #3f3f46; font-size: 13px; font-weight: 500; color: #8b8b94;">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M12 6v6l4 2"></path></svg>
          <span>Exact time</span>
        </div>
        <div style="height: 34px; box-sizing: border-box; display: flex; align-items: center; gap: 7px; padding: 0 12px; border-radius: 9999px; border: 1px dashed #3f3f46; font-size: 13px; font-weight: 500; color: #8b8b94;">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M17 6H3"></path><path d="M21 12H3"></path><path d="M13 18H3"></path></svg>
          <span>Note</span>
        </div>
      </div>
    </div>

    <div style="display: flex; align-items: center; justify-content: flex-end; gap: 10px; padding: 14px 24px; border-top: 1px solid #27272a;">
      <div style="height: 40px; box-sizing: border-box; display: flex; align-items: center; padding: 0 16px; border-radius: 6px; background: #27272a; border: 1px solid #3f3f46; font-size: 14px; font-weight: 600; color: #ffffff;">Cancel</div>
      <div style="height: 40px; box-sizing: border-box; display: flex; align-items: center; padding: 0 20px; border-radius: 6px; background: #ffffff; border: 1px solid #ffffff; font-size: 14px; font-weight: 600; color: #000000;">Save task</div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
